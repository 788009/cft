<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>可交互蹭饭图</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="m-0 overflow-hidden bg-gray-50 p-0 text-gray-800 dark:bg-slate-950 dark:text-slate-100">
    <div id="app" class="relative w-screen h-screen flex">
      <!-- 横屏引导 -->
      <div id="orientation-guide" data-testid="orientation-guide" aria-live="polite" aria-hidden="true" class="absolute inset-0 z-50 flex items-center justify-center bg-white dark:bg-slate-950 hidden">
        <p class="text-xl font-medium">请将设备横屏以获得完整体验</p>
      </div>
      
      <!-- 地图容器 -->
      <div id="map-container" data-testid="map-container" class="absolute inset-0 z-0"></div>
      
      <!-- UI 容器 -->
      <div id="ui-container" data-testid="ui-container" class="absolute inset-0 z-10 pointer-events-none"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
